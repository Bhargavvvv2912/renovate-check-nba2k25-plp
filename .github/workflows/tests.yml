name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      # The same ladder aura.environment climbs. pip 24.1 skips any release
      # whose metadata is not valid PEP 440 and then reports it as missing, so
      # a baseline that needs an older installer would fail here and every
      # Dependabot pull request with it -- scoring this arm on a repository
      # that never worked rather than on what Dependabot proposed.
      # Then, as the arms do, the build tools of the pins' own era for a
      # source distribution a current setuptools can no longer build.
      - run: |
          python -m pip install -r requirements.txt || { python -m pip install -q pip==24.0 && python -m pip install -r requirements.txt; } || { python -m pip install -q setuptools==62.0.0 wheel==0.37.1 && python -m pip install --no-build-isolation -r requirements.txt; }
      # --deselect: tests that fail before anything is bumped. CI judges a
      # pull request absolutely, the arms judge against the baseline; without
      # this the project's own broken test fails every pull request.
      - run: python -m pytest tests --deselect tests/test_forgot_password.py::test_an_unknown_address_looks_identical_to_success --deselect tests/test_forgot_password.py::test_sends_a_reset_link_to_a_known_address --deselect tests/test_forgot_password.py::test_tells_the_truth_when_sending_fails --deselect tests/test_notices.py::test_create_form_carries_the_scrape_warning --deselect tests/test_notices.py::test_dashboard_carries_the_changeover_notice --deselect tests/test_notices.py::test_every_badge_of_the_version_has_a_select_the_import_can_fill[2K26] --deselect tests/test_notices.py::test_every_badge_of_the_version_has_a_select_the_import_can_fill[2K27] --deselect tests/test_notices.py::test_every_scraped_attribute_has_a_field_the_import_can_fill[2K26] --deselect tests/test_notices.py::test_every_scraped_attribute_has_a_field_the_import_can_fill[2K27] --deselect tests/test_notices.py::test_intangibles_keeps_its_default_on_the_form --deselect tests/test_notices.py::test_scrape_endpoint_returns_the_player_data --deselect tests/test_notices.py::test_scrape_returns_35_attributes_and_never_intangibles --deselect tests/test_notices.py::test_the_notice_is_not_an_alert --deselect tests/test_notices.py::test_the_warning_sits_with_the_scrape_button_not_the_create_button --deselect tests/test_players.py::test_a_2k26_player_cannot_upgrade_a_2k27_badge_by_hand_crafting_a_post --deselect tests/test_players.py::test_a_2k27_player_cannot_upgrade_a_dropped_2k26_badge --deselect tests/test_players.py::test_a_2k27_player_has_the_new_badges_and_not_the_dropped_ones --deselect tests/test_players.py::test_a_badge_from_another_version_in_the_create_form_is_ignored --deselect tests/test_players.py::test_a_badgepoint_upgrade_of_a_foreign_badge_is_refused_too --deselect tests/test_players.py::test_a_blank_name_in_an_edit_is_refused --deselect tests/test_players.py::test_a_blank_name_is_rejected --deselect tests/test_players.py::test_a_legendary_badge_cannot_be_upgraded_further --deselect tests/test_players.py::test_a_lowercase_game_version_is_rejected --deselect tests/test_players.py::test_a_non_numeric_attribute_is_rejected_and_creates_no_player --deselect tests/test_players.py::test_a_non_numeric_edit_is_refused_and_saves_nothing --deselect tests/test_players.py::test_a_user_cannot_edit_another_users_player --deselect tests/test_players.py::test_a_user_cannot_set_targets_on_another_users_player --deselect tests/test_players.py::test_a_user_cannot_upgrade_another_users_player --deselect tests/test_players.py::test_a_user_cannot_view_another_users_upgrade_page --deselect tests/test_players.py::test_an_attribute_that_does_not_exist_is_refused --deselect tests/test_players.py::test_an_invalid_badge_level_in_an_edit_is_refused --deselect tests/test_players.py::test_an_invalid_badge_level_is_rejected_and_creates_no_player --deselect tests/test_players.py::test_an_invalid_target_badge_level_is_rejected_and_saves_nothing --deselect tests/test_players.py::test_an_out_of_range_attribute_is_rejected_and_creates_no_player --deselect tests/test_players.py::test_an_out_of_range_edit_is_refused_with_a_flash_not_a_500 --deselect tests/test_players.py::test_an_out_of_range_target_is_rejected_and_saves_nothing --deselect tests/test_players.py::test_an_unknown_game_version_is_rejected_and_creates_no_player --deselect tests/test_players.py::test_an_upgrade_without_enough_devpoints_changes_nothing --deselect tests/test_players.py::test_creating_a_2k26_player_gets_40_badge_rows --deselect tests/test_players.py::test_creating_a_2k27_player_gets_53_badge_rows --deselect tests/test_players.py::test_creating_a_player_with_no_version_at_all_is_rejected --deselect tests/test_players.py::test_editing_renames_the_player --deselect tests/test_players.py::test_editing_saves_badge_levels --deselect tests/test_players.py::test_editing_saves_every_attribute_not_just_the_first --deselect tests/test_players.py::test_editing_writes_values_directly_outside_the_economy --deselect tests/te